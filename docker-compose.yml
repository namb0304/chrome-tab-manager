version: '3.8'

services:
  # 1. FastAPIバックエンドサービス
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # --reload を使うことで、ホスト側でコードを変更したらコンテナ内も自動でリロードされます
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app  # ホストの /backend をコンテナの /app にマウント
    ports:
      - "8000:8000"     # ホスト側の8000番ポートに接続
    depends_on:
      - db
    # .envファイルから環境変数を読み込む
    env_file:
      - .env
    environment:
      # DB接続情報 (main.py の設定と一致させる)
      DATABASE_URL: postgresql://user:password@db:5432/mydatabase

  # 2. PostgreSQLデータベースサービス
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: