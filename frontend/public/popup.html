<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイト追加</title>
    <style>
        body {
            width: 350px;
            min-height: 400px;
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #0056b3;
        }
        .open-dashboard {
            background: #6c757d;
        }
        .open-dashboard:hover {
            background: #5a6268;
        }
        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 8px;
        }
        .success {
            color: #28a745;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h2>現在のサイトをダッシュボードに追加</h2>
    
    <div class="form-group">
        <label>サイト名:</label>
        <input type="text" id="title" placeholder="自動取得されます">
    </div>

    <div class="form-group">
        <label>URL:</label>
        <input type="url" id="url" readonly>
    </div>

    <div class="form-group">
        <label>カテゴリ:</label>
        <select id="category">
            <option value="">読み込み中...</option>
        </select>
    </div>

    <button id="addButton">追加する</button>
    <button class="open-dashboard" id="dashboardButton">ダッシュボードを開く</button>
    
    <div id="message"></div>

    <script src="./popup.js"></script>
</body>
</html>
